name: build-test-deploy
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checks out repository code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      
      - run: npm install
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checks out repository code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      
      - run: npm install
      - run: npm run test

  deploy:
    needs: [build, test]
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checks out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - run: npm install

      - name: Build with base path
        run: npm run build -- --base=./

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
