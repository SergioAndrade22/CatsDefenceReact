name: build-test-deploy

on:
  push:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package source workspace
        run: tar -czf /tmp/source-workspace.tar.gz --exclude=.git --exclude=dist --exclude=node_modules .

      - name: Package installed dependencies
        run: tar -czf /tmp/node_modules.tar.gz node_modules

      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: source-workspace
          path: /tmp/source-workspace.tar.gz
          retention-days: 1

      - name: Upload installed dependencies
        uses: actions/upload-artifact@v4
        with:
          name: installed-dependencies
          path: /tmp/node_modules.tar.gz
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download source workspace
        uses: actions/download-artifact@v4
        with:
          name: source-workspace

      - name: Restore source workspace
        run: tar -xzf source-workspace.tar.gz

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: installed-dependencies
          path: .

      - name: Restore installed dependencies
        run: tar -xzf node_modules.tar.gz

      - name: Verify installed dependencies
        run: test -x node_modules/.bin/vite

      - name: Build application
        run: npm run build -- --base=./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download source workspace
        uses: actions/download-artifact@v4
        with:
          name: source-workspace

      - name: Restore source workspace
        run: tar -xzf source-workspace.tar.gz

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: installed-dependencies
          path: .

      - name: Restore installed dependencies
        run: tar -xzf node_modules.tar.gz

      - name: Verify installed dependencies
        run: test -x node_modules/.bin/vitest

      - name: Run tests
        run: npm run test

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download source workspace
        uses: actions/download-artifact@v4
        with:
          name: source-workspace

      - name: Restore source workspace
        run: tar -xzf source-workspace.tar.gz

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: installed-dependencies
          path: .

      - name: Restore installed dependencies
        run: tar -xzf node_modules.tar.gz

      - name: Verify installed dependencies
        run: test -x node_modules/.bin/eslint

      - name: Run lint
        run: npm run lint

  deploy:
    needs: [build, test, lint]
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
